name: ARVIO Google TV Streamer 32-bit Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'ARVIO/tweaks'
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/arvio-streamer32-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ARVIO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ARVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARVIO_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release signing requires four ARVIO_RELEASE_* GitHub Actions secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arvio-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/arvio-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties "$RUNNER_TEMP/arvio-release.jks"
      - name: Build optimized signed sideload release
        run: bash ./gradlew :app:assembleSideloadRelease -Pstreamer32Only=true --stacktrace --no-daemon
      - name: Verify 32-bit APK contents and release certificate
        run: |
          APK=$(find app/build/outputs/apk/sideload/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              abis = {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')}
          print('Native ABIs:', sorted(abis))
          assert abis == {'armeabi-v7a'}, f'Unexpected native ABIs: {abis}'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|native-code:"
      - name: Upload signed Google TV Streamer APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-google-tv-streamer-32bit-release
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error

