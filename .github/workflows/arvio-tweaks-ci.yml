name: ARVIO Tweaks Android CI

on:
  push:
    branches:
      - 'ARVIO/tweaks'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Gradle build and unit tests
        run: bash ./gradlew :app:assembleSideloadDebug :app:testSideloadDebugUnitTest --stacktrace --no-daemon
      - name: Upload test APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvio-tweaks-debug
          path: |
            app/build/outputs/apk/sideload/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: warn
